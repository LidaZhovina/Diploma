name: Deploy Yii2 to Beget

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Run deploy commands via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        script: |
          # 1. Переходим в папку с сайтом на Бегете 
          cd ~/sanatoriy/public_html
          
          # 2. Забираем изменения из гита
          git pull origin main
